const PROJECT="chemstore-pro";

const BASE=`https://firestore.googleapis.com/v1/projects/${PROJECT}/databases/(default)/documents`;

function fromDoc(doc){
  if(!doc||!doc.fields)return null;
  const obj={docId:doc.name?.split("/").pop()};
  for(const[k,v]of Object.entries(doc.fields)){
    if(v.stringValue!==undefined)obj[k]=v.stringValue;
    else if(v.integerValue!==undefined)obj[k]=Number(v.integerValue);
    else if(v.doubleValue!==undefined)obj[k]=Number(v.doubleValue);
    else if(v.booleanValue!==undefined)obj[k]=v.booleanValue;
    else if(v.arrayValue!==undefined)obj[k]=(v.arrayValue.values||[]).map(x=>x.stringValue||String(x.integerValue||x.doubleValue||""));
    else obj[k]="";
  }
  return obj;
}
function toFields(obj){
  const fields={};
  for(const[k,v]of Object.entries(obj)){
    if(k==="docId")continue;
    if(Array.isArray(v))fields[k]={arrayValue:{values:v.map(x=>({stringValue:String(x)}))}};
    else if(typeof v==="number")fields[k]={doubleValue:v};
    else if(typeof v==="boolean")fields[k]={booleanValue:v};
    else fields[k]={stringValue:String(v??"")};
  }
  return{fields};
}
async function fsGet(col){
  const r=await fetch(`${BASE}/${col}?key=${API_KEY}&pageSize=300`);
  const d=await r.json();
  return(d.documents||[]).map(fromDoc).filter(Boolean);
}
async function fsAdd(col,data){
  const r=await fetch(`${BASE}/${col}?key=${API_KEY}`,{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify(toFields(data))
  });
  return await r.json();
}
async function fsUpdate(col,docId,data){
  if(!docId)throw new Error("docId is required for update");
  const fields=toFields(data).fields;
  const mask=Object.keys(fields).map(f=>`updateMask.fieldPaths=${encodeURIComponent(f)}`).join("&");
  const r=await fetch(`${BASE}/${col}/${docId}?key=${API_KEY}&${mask}`,{
    method:"PATCH",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({fields})
  });
  return await r.json();
}
async function fsDelete(col,docId){
  await fetch(`${BASE}/${col}/${docId}?key=${API_KEY}`,{method:"DELETE"});
}

const CURRENCIES=[{v:"BDT",sym:"৳"},{v:"USD",sym:"$"}];

function genId(){return Date.now()+Math.floor(Math.random()*99999);}
function mkRacks(rows){const r=[];rows.forEach(l=>[1,2,3,4,5].forEach(n=>r.push(`${l}-${String(n).padStart(2,"0")}`)));return r;}
function fmtCur(a,c){const s=CURRENCIES.find(x=>x.v===c)?.sym||"৳";return`${s}${Number(a||0).toLocaleString(undefined,{maximumFractionDigits:2})}`;}

// Unit conversion to base unit (kg or L)
function toBaseUnit(amount,unit){
  if(unit==="g")return amount/1000;
  if(unit==="mL")return amount/1000;
  if(unit==="ton")return amount*1000;
  return amount;
}
function fromBaseUnit(amount,unit){
  if(unit==="g")return amount*1000;
  if(unit==="mL")return amount*1000;
  if(unit==="ton")return amount/1000;
  return amount;
}

// WAC = (oldQty*oldCost + newQty*newCost) / (oldQty+newQty)
function calcWAC(oldQty,oldCost,newQty,newCost){
  const total=oldQty+newQty;
  if(total===0)return newCost;
  return((oldQty*oldCost)+(newQty*newCost))/total;
}

function buildLedger(chem,logs){
  const cl=[...logs.filter(l=>String(l.chemId)===String(chem.id))].sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  let bal=Number(chem.openingBalance||0);
  let wac=Number(chem.pricePerUnit||0);
  const rows=cl.map(l=>{
    const q=Number(l.amount);const b=bal;
    if(l.action==="IN"){
      // Recalculate WAC on each IN
      if(l.pricePerUnit&&Number(l.pricePerUnit)>0){
        wac=calcWAC(bal,wac,q,Number(l.pricePerUnit));
      }
      bal+=q;
    }
    if(l.action==="OUT")bal-=q;
    return{...l,before:b,qty:q,after:bal,wacAtTime:wac};
  });
  return{opening:Number(chem.openingBalance||0),ledger:rows,closing:bal,currentWAC:wac};
}

function exportCSV(data,filename,cols){
  const hdr=cols.map(c=>c.label).join(",");
  const rows=data.map(r=>cols.map(c=>{let v=c.get?c.get(r):(r[c.key]??"");if(typeof v==="string"&&(v.includes(",")||v.includes('"')))v=`"${v.replace(/"/g,'""')}"`;return v;}).join(","));
  const blob=new Blob(["\uFEFF"+[hdr,...rows].join("\n")],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url);
}

// ── SAFETY CONFLICT BAR ───────────────────────────────────────────────────────
function SafetyBar({chemicals,racks}){
  const conflicts=[];
  racks.forEach(rack=>{
    const chems=chemicals.filter(c=>c.rack===rack&&c.status==="IN");
    for(let i=0;i<chems.length;i++)for(let j=i+1;j<chems.length;j++){
      const h1=chems[i].hazardClass||"NONE",h2=chems[j].hazardClass||"NONE";
      if(COMPAT_MATRIX[h1]?.[h2]===false){
        conflicts.push({rack,a:chems[i].name,b:chems[j].name,h1,h2});
      }
    }
  });
  if(conflicts.length===0)return(
    <div style={{background:"#14532d22",border:"1px solid #4ade8044",padding:"8px 20px",display:"flex",alignItems:"center",gap:"10px"}}>
      <div style={{width:"8px",height:"8px",borderRadius:"50%",background:"#4ade80",boxShadow:"0 0 8px #4ade80"}}/>
      <span style={{color:"#4ade80",fontSize:"11px",fontWeight:"700"}}>✅ Safety Status: All racks SAFE — No compatibility conflicts detected</span>
    </div>
  );
  return(
    <div style={{background:"#7f1d1d33",border:"1px solid #ef4444",padding:"8px 20px",display:"flex",alignItems:"center",gap:"10px",flexWrap:"wrap",animation:"alertPulse 2s infinite"}}>
      <div style={{width:"8px",height:"8px",borderRadius:"50%",background:"#ef4444",boxShadow:"0 0 8px #ef4444",animation:"pulse 1s infinite"}}/>
      <span style={{color:"#ef4444",fontSize:"11px",fontWeight:"700"}}>⛔ SAFETY CONFLICT: {conflicts.length} rack{conflicts.length>1?"s":""} with incompatible chemicals!</span>
      {conflicts.slice(0,2).map((c,i)=>(
        <span key={i} style={{background:"#7f1d1d",color:"#fca5a5",fontSize:"10px",borderRadius:"4px",padding:"2px 8px"}}>
          Rack {c.rack}: {c.a} × {c.b}
        </span>
      ))}
    </div>
  );
}

function DashCards({chemicals,logs,onTabChange}){
  const ins=chemicals.filter(c=>c.status==="IN");
  const low=ins.filter(c=>{const{closing}=buildLedger(c,logs);return closing<=c.lowStockThreshold;});
  const exp=ins.filter(c=>c.expDate&&new Date(c.expDate)<new Date(Date.now()+30*864e5));
  const expired=ins.filter(c=>c.expDate&&new Date(c.expDate)<new Date());
  const bdtV=ins.filter(c=>c.currency==="BDT").reduce((s,c)=>{const{closing,currentWAC}=buildLedger(c,logs);return s+closing*currentWAC;},0);
  const usdV=ins.filter(c=>c.currency==="USD").reduce((s,c)=>{const{closing,currentWAC}=buildLedger(c,logs);return s+closing*currentWAC;},0);

  const cards=[
    {label:"Total In Stock",value:ins.length,icon:"📦",color:"#38bdf8",sub:`${ins.filter(c=>c.type==="DYE").length} Dyes · ${ins.filter(c=>c.type==="CHEMICAL").length} Chems`,tab:"stock",
     bg:"linear-gradient(135deg,#0c1a3a,#0f2440)"},
    {label:"Low Stock 🔴",value:low.length,icon:"📉",color:low.length?"#ef4444":"#4ade80",
     sub:low.length?low.slice(0,2).map(c=>c.name.split(" ")[0]).join(", "):"All levels OK",tab:"alerts",
     bg:low.length?"linear-gradient(135deg,#1a0505,#2d0808)":"linear-gradient(135deg,#051a09,#082d0e)",
     blink:low.length>0},
    {label:"Expiring Soon 🟡",value:exp.length,icon:"📅",color:exp.length?"#f59e0b":"#4ade80",
     sub:expired.length?`⛔ ${expired.length} EXPIRED!`:exp.length?exp.slice(0,2).map(c=>c.name.split(" ")[0]).join(", "):"No expiry warnings",
     tab:"alerts",bg:exp.length?"linear-gradient(135deg,#1a1000,#2d1f00)":"linear-gradient(135deg,#051a09,#082d0e)",
     blink:expired.length>0},
    {label:"Value BDT ৳",value:`৳${(bdtV/1000).toFixed(1)}K`,icon:"💵",color:"#4ade80",
     sub:"WAC-based valuation",tab:"stock",bg:"linear-gradient(135deg,#021a0a,#051f0e)"},
    {label:"Value USD $",value:`$${usdV.toFixed(0)}`,icon:"💲",color:"#34d399",
     sub:"WAC-based valuation",tab:"stock",bg:"linear-gradient(135deg,#021a12,#051f16)"},
    {label:"Total Logs",value:logs.length,icon:"📜",color:"#a78bfa",
     sub:"IN/OUT transactions",tab:"log",bg:"linear-gradient(135deg,#1a0a3a,#1e1040)"},
  ];

  return(
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(155px,1fr))",gap:"10px",padding:"14px 20px"}}>
      {cards.map(c=>(
        <div key={c.label} onClick={()=>onTabChange(c.tab)} className="card-hover"
          style={{background:c.bg||"linear-gradient(135deg,#1e293b,#0f172a)",borderRadius:"12px",padding:"14px",
            border:`1px solid ${c.color}44`,position:"relative",overflow:"hidden",
            boxShadow:c.blink?`0 0 15px ${c.color}44`:`0 4px 15px ${c.color}11`,
            animation:c.blink?"alertPulse 2s infinite":"none"}}>
          <div style={{position:"absolute",top:"-8px",right:"-8px",width:"60px",height:"60px",borderRadius:"50%",background:c.color,opacity:0.06}}/>
          <div style={{fontSize:"22px",marginBottom:"6px"}}>{c.icon}</div>
          <div style={{fontSize:"24px",fontWeight:"900",color:c.color,lineHeight:1,textShadow:`0 0 15px ${c.color}55`}}>{c.value}</div>
          <div style={{fontSize:"10px",color:"#94a3b8",marginTop:"4px",fontWeight:"700"}}>{c.label}</div>
          <div style={{fontSize:"9px",color:"#475569",marginTop:"2px",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.sub}</div>
          <div style={{fontSize:"8px",color:c.color+"66",marginTop:"4px"}}>▶ tap to view</div>
        </div>
      ))}
    </div>
  );
}

// ── TICKER ────────────────────────────────────────────────────────────────────
function Ticker({logs,chemicals}){
  const low=chemicals.filter(c=>c.status==="IN"&&c.amount<=c.lowStockThreshold);
  const items=[
    ...[...logs].reverse().slice(0,5).map(l=>({text:`${l.action==="IN"?"📥 IN":"📤 OUT"} · ${l.chemName} · ${l.action==="IN"?"+":"-"}${l.amount}${l.unit} · ${l.date}`,color:l.action==="IN"?"#4ade80":"#f87171"})),
    ...low.map(c=>({text:`🔴 LOW STOCK ALERT · ${c.name} · ${c.amount}${c.unit} remaining`,color:"#ef4444"}))
  ];
  const[idx,setIdx]=useState(0);
  useEffect(()=>{if(!items.length)return;const t=setInterval(()=>setIdx(i=>(i+1)%items.length),3500);return()=>clearInterval(t);},[items.length]);
  if(!items.length)return null;
  const item=items[idx%items.length];
  return(
    <div style={{background:"#0a1628",borderTop:"1px solid #1e293b",borderBottom:"1px solid #1e293b",padding:"7px 20px",display:"flex",alignItems:"center",gap:"12px"}}>
      <span style={{color:"#ef4444",fontSize:"9px",letterSpacing:"1px",whiteSpace:"nowrap",animation:"pulse 1.5s infinite"}}>◉ LIVE</span>
      <span style={{color:item.color,fontSize:"11px"}}>{item.text}</span>
    </div>
  );
}

// ── WAREHOUSE GRID ────────────────────────────────────────────────────────────
function WarehouseGrid({chemicals,racks,logs,onSelectRack,selectedRack}){
  const letters=[...new Set(racks.map(r=>r.split("-")[0]))].sort();
  const getConflict=(chems)=>{
    for(let i=0;i<chems.length;i++)for(let j=i+1;j<chems.length;j++){
      const h1=chems[i].hazardClass||"NONE",h2=chems[j].hazardClass||"NONE";
      if(COMPAT_MATRIX[h1]?.[h2]===false)return"DANGER";
      if(COMPAT_MATRIX[h1]?.[h2]==="caution")return"CAUTION";
    }
    return"OK";
  };
  return(
    <div style={{padding:"14px 20px"}}>
      <div style={{overflowX:"auto"}}>
        <div style={{display:"flex",gap:"10px",minWidth:"fit-content"}}>
          {letters.map(lt=>{
            const rr=racks.filter(r=>r.startsWith(lt+"-")).sort();
            return(
              <div key={lt} style={{display:"flex",flexDirection:"column",gap:"7px"}}>
                <div style={{textAlign:"center",fontSize:"10px",color:"#38bdf8",fontWeight:"700",letterSpacing:"2px",padding:"3px 0",borderBottom:"1px solid #1e293b"}}>ROW {lt}</div>
                {rr.map(rack=>{
                  const chems=chemicals.filter(x=>x.rack===rack&&x.status==="IN");
                  const sel=selectedRack===rack;
                  const conflict=getConflict(chems);
                  const first=chems[0];
                  const haz=HAZARD_CLASSES[first?.hazardClass||"NONE"];
                  const hasLow=chems.some(c=>{const{closing}=buildLedger(c,logs);return closing<=c.lowStockThreshold;});
                  const hasExp=chems.some(c=>c.expDate&&new Date(c.expDate)<new Date(Date.now()+30*864e5));
                  const hasExpired=chems.some(c=>c.expDate&&new Date(c.expDate)<new Date());
                  const bc=sel?"#38bdf8":conflict==="DANGER"?"#ef4444":conflict==="CAUTION"?"#f59e0b":chems.length?haz.color+"66":"#1e3a5f";
                  const bg=conflict==="DANGER"?"linear-gradient(135deg,#2d0808,#1a0505)":conflict==="CAUTION"?"linear-gradient(135deg,#2d1f00,#1a1000)":chems.length?`linear-gradient(135deg,${haz.color}22,${haz.color}08)`:"#0a1628";
                  return(
                    <div key={rack} onClick={()=>onSelectRack(sel?null:rack)} className="rack-item"
                      style={{width:"105px",minHeight:"88px",borderRadius:"10px",cursor:"pointer",
                        border:`2px ${chems.length?"solid":"dashed"} ${bc}`,background:bg,
                        display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
                        gap:"2px",position:"relative",padding:"4px",
                        boxShadow:sel?`0 0 20px #38bdf855`:conflict==="DANGER"?`0 0 15px #ef444433`:"none"}}>
                      <div style={{position:"absolute",top:"3px",left:"6px",fontSize:"9px",color:"#475569"}}>{rack}</div>
                      <div style={{position:"absolute",top:"3px",right:"5px",fontSize:"9px"}}>
                        {conflict==="DANGER"?"⛔":conflict==="CAUTION"?"⚠️":hasExpired?"💀":hasLow?"🔴":hasExp?"🟡":""}
                      </div>
                      {chems.length>0?(
                        chems.length===1?(
                          <>
                            <div style={{fontSize:"18px"}}>{haz.icon}</div>
                            <div style={{fontSize:"7px",color:sel?"#38bdf8":"#e2e8f0",fontWeight:"800",textAlign:"center",padding:"0 4px",lineHeight:"1.3",maxWidth:"95px",overflow:"hidden"}}>
                              {first.name.length>16?first.name.slice(0,15)+"…":first.name}
                            </div>
                            <div style={{fontSize:"8px",color:haz.color,fontWeight:"700"}}>{first.amount}{first.unit}</div>
                            <div style={{fontSize:"7px",background:haz.color+"33",color:haz.color,borderRadius:"3px",padding:"1px 4px"}}>{haz.short}</div>
                          </>
                        ):(
                          <>
                            <div style={{fontSize:"11px",color:"#fbbf24",fontWeight:"800"}}>{chems.length} items</div>
                            {chems.slice(0,3).map((c,i)=>{
                              const h=HAZARD_CLASSES[c.hazardClass||"NONE"];
                              return(<div key={i} style={{fontSize:"7px",color:h.color,textAlign:"center",overflow:"hidden",maxWidth:"95px",whiteSpace:"nowrap",textOverflow:"ellipsis"}}>{h.icon} {c.name.slice(0,10)}</div>);
                            })}
                          </>
                        )
                      ):(
                        <div style={{fontSize:"9px",color:"#1e3a5f"}}>EMPTY</div>
                      )}
                    </div>
                  );
                })}
              </div>
            );
          })}
        </div>
      </div>
      {/* Legend */}
      <div style={{display:"flex",gap:"8px",flexWrap:"wrap",marginTop:"12px",paddingTop:"10px",borderTop:"1px solid #1e293b",fontSize:"10px"}}>
        {Object.entries(HAZARD_CLASSES).map(([k,v])=>(
          <div key={k} style={{display:"flex",alignItems:"center",gap:"3px",color:"#94a3b8"}}>
            <span style={{width:"8px",height:"8px",borderRadius:"2px",background:v.color,display:"inline-block"}}/>
            {v.icon} {v.label.split(" ")[0]}
          </div>
        ))}
        <span style={{color:"#ef4444"}}>⛔ Conflict</span>
        <span style={{color:"#f59e0b"}}>⚠️ Caution</span>
        <span style={{color:"#ef4444"}}>🔴 Low</span>
        <span style={{color:"#f59e0b"}}>🟡 Expiring</span>
        <span style={{color:"#ef4444"}}>💀 Expired</span>
      </div>
    </div>
  );
}

// ── STOCK LEDGER ──────────────────────────────────────────────────────────────
function StockLedger({chemicals,logs,onEdit,onOut}){
  const[search,setSearch]=useState("");
  const[fType,setFType]=useState("ALL");
  const[expanded,setExpanded]=useState(null);
  const filtered=chemicals.filter(c=>
    (fType==="ALL"||c.type===fType||(fType==="LOW"&&c.amount<=c.lowStockThreshold)||(fType==="EXP"&&c.expDate&&new Date(c.expDate)<new Date(Date.now()+30*864e5)))&&
    (c.name?.toLowerCase().includes(search.toLowerCase())||(c.code||"").toLowerCase().includes(search.toLowerCase()))
  );
  const cols=[
    {label:"Code",get:r=>r.code||"—"},{label:"Name",get:r=>r.name},{label:"Unit",get:r=>r.unit},
    {label:"Opening",get:r=>`${r.openingBalance||0}`},
    {label:"Total IN",get:r=>`+${logs.filter(l=>String(l.chemId)===String(r.id)&&l.action==="IN").reduce((s,l)=>s+Number(l.amount),0)}`},
    {label:"Total OUT",get:r=>`-${logs.filter(l=>String(l.chemId)===String(r.id)&&l.action==="OUT").reduce((s,l)=>s+Number(l.amount),0)}`},
    {label:"Closing Bal.",get:r=>`${buildLedger(r,logs).closing} ${r.unit}`},
    {label:"WAC",get:r=>`${fmtCur(buildLedger(r,logs).currentWAC,r.currency)}/${r.unit}`},
    {label:"Total Value",get:r=>{const{closing,currentWAC}=buildLedger(r,logs);return fmtCur(closing*currentWAC,r.currency);}},
    {label:"Hazard",get:r=>HAZARD_CLASSES[r.hazardClass||"NONE"]?.label||"—"},
    {label:"Rack",get:r=>r.rack||"—"},
  ];
  return(
    <div style={{padding:"12px 20px"}}>
      <div style={{display:"flex",gap:"6px",marginBottom:"10px",flexWrap:"wrap",alignItems:"center"}}>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search name/code…"
          autoComplete="off" spellCheck="false"
          style={{flex:1,minWidth:"130px",background:"#1e293b",border:"1px solid #334155",borderRadius:"7px",padding:"8px 10px",color:"#e2e8f0",fontSize:"13px"}}/>
        {["ALL","DYE","CHEMICAL","LOW","EXP"].map(f=>(
          <button key={f} onClick={()=>setFType(f)} className="btn-hover"
            style={{padding:"6px 12px",borderRadius:"7px",border:"none",cursor:"pointer",fontSize:"10px",
              background:fType===f?"#38bdf8":"#1e293b",color:fType===f?"#0f172a":"#94a3b8",fontWeight:fType===f?"700":"400"}}>
            {f==="LOW"?"🔴LOW":f==="EXP"?"🟡EXP":f}
          </button>
        ))}
        <button onClick={()=>exportCSV(filtered,`stock_${new Date().toISOString().split("T")[0]}.csv`,cols)}
          className="btn-hover" style={{padding:"6px 12px",borderRadius:"7px",border:"none",cursor:"pointer",fontSize:"10px",background:"#166534",color:"#4ade80",marginLeft:"auto"}}>
          📊 Excel
        </button>
        <button onClick={()=>{
          const w=window.open("","_blank");
          const rows=filtered.map(r=>`<tr>${cols.map(c=>`<td>${c.get(r)}</td>`).join("")}</tr>`).join("");
          w.document.write(`<html><head><style>body{font-family:monospace;font-size:11px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #ccc;padding:5px 8px}th{background:#1e293b;color:#fff}</style></head><body><h3>ChemStore Pro — Stock Ledger</h3><table><thead><tr>${cols.map(c=>`<th>${c.label}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></body></html>`);
          w.document.close();w.print();
        }} className="btn-hover" style={{padding:"6px 12px",borderRadius:"7px",border:"none",cursor:"pointer",fontSize:"10px",background:"#1e3a5f",color:"#60a5fa"}}>
          🖨️ Print
        </button>
      </div>
      <div style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:"10px"}}>
          <thead>
            <tr style={{background:"#1e293b"}}>
              <th style={{padding:"8px 5px",color:"#475569",width:"18px"}}/>
              <th style={{padding:"8px",color:"#94a3b8",textAlign:"left",whiteSpace:"nowrap"}}>Code</th>
              <th style={{padding:"8px",color:"#94a3b8",textAlign:"left",whiteSpace:"nowrap"}}>Name</th>
              <th style={{padding:"8px",color:"#94a3b8",textAlign:"left"}}>Unit</th>
              <th style={{padding:"8px",color:"#22d3ee",textAlign:"left",borderLeft:"2px solid #0f2e4a",whiteSpace:"nowrap"}}>Opening</th>
              <th style={{padding:"8px",color:"#4ade80",textAlign:"left",whiteSpace:"nowrap"}}>+IN</th>
              <th style={{padding:"8px",color:"#f87171",textAlign:"left",whiteSpace:"nowrap"}}>−OUT</th>
              <th style={{padding:"8px",color:"#fbbf24",textAlign:"left",borderRight:"2px solid #0f2e4a",whiteSpace:"nowrap"}}>Closing</th>
              <th style={{padding:"8px",color:"#a78bfa",textAlign:"left",whiteSpace:"nowrap"}}>WAC</th>
              <th style={{padding:"8px",color:"#4ade80",textAlign:"left",whiteSpace:"nowrap"}}>Value</th>
              <th style={{padding:"8px",color:"#94a3b8",textAlign:"left",whiteSpace:"nowrap"}}>Hazard</th>
              <th style={{padding:"8px",color:"#94a3b8",textAlign:"left"}}>Rack</th>
              <th style={{padding:"8px",color:"#94a3b8",textAlign:"left"}}>Actions</th>
            </tr>
          </thead>
          <tbody>
            {filtered.map((c,i)=>{
              const{opening,ledger,closing,currentWAC}=buildLedger(c,logs);
              const totIn=ledger.filter(l=>l.action==="IN").reduce((s,l)=>s+l.qty,0);
              const totOut=ledger.filter(l=>l.action==="OUT").reduce((s,l)=>s+l.qty,0);
              const isLow=closing<=c.lowStockThreshold;
              const isExp=c.expDate&&new Date(c.expDate)<new Date(Date.now()+30*864e5);
              const isExpired=c.expDate&&new Date(c.expDate)<new Date();
              const isEx=expanded===c.docId;
              const haz=HAZARD_CLASSES[c.hazardClass||"NONE"];
              const rowBg=isExpired?"#1a050522":isLow?"#1a050511":i%2===0?"#0a1628":"#0f172a";
              return(
                <Fragment key={c.docId||i}>
                  <tr style={{background:rowBg,borderBottom:"1px solid #1e293b",cursor:"pointer",
                    borderLeft:isExpired?"3px solid #ef4444":isLow?"3px solid #f97316":isExp?"3px solid #f59e0b":"3px solid transparent"}}
                    onClick={()=>setExpanded(isEx?null:c.docId)}>
                    <td style={{padding:"6px 5px",color:"#475569",textAlign:"center",fontSize:"9px"}}>{isEx?"▼":"▶"}</td>
                    <td style={{padding:"6px 8px",color:"#38bdf8",whiteSpace:"nowrap"}}>{c.code}</td>
                    <td style={{padding:"6px 8px",fontWeight:"700",whiteSpace:"nowrap"}}>
                      {c.name}

                      {!isExpired&&isLow&&<span style={{color:"#f97316",fontSize:"9px",marginLeft:"4px"}}>🔴LOW</span>}
                      {!isExpired&&!isLow&&isExp&&<span style={{color:"#f59e0b",fontSize:"9px",marginLeft:"4px"}}>🟡EXP</span>}
                    </td>
                    <td style={{padding:"6px 8px",color:"#94a3b8"}}>{c.unit}</td>
                    <td style={{padding:"6px 8px",color:"#22d3ee",fontWeight:"700",borderLeft:"2px solid #0f2e4a"}}>{opening}</td>
                    <td style={{padding:"6px 8px",color:"#4ade80",fontWeight:"700"}}>+{totIn}</td>
                    <td style={{padding:"6px 8px",color:"#f87171",fontWeight:"700"}}>−{totOut}</td>
                    <td style={{padding:"6px 8px",borderRight:"2px solid #0f2e4a"}}>
                      <span style={{color:isLow?"#ef4444":"#fbbf24",fontWeight:"900"}}>{parseFloat(closing.toFixed(3))} {c.unit}</span>
                    </td>
                    <td style={{padding:"6px 8px",color:"#a78bfa",whiteSpace:"nowrap"}}>{fmtCur(currentWAC,c.currency)}</td>
                    <td style={{padding:"6px 8px",color:"#4ade80",fontWeight:"700",whiteSpace:"nowrap"}}>{fmtCur(closing*currentWAC,c.currency)}</td>
                    <td style={{padding:"6px 8px"}}>
                      <span style={{background:haz.color+"33",color:haz.color,borderRadius:"4px",padding:"2px 6px",fontSize:"9px",whiteSpace:"nowrap"}}>
                        {haz.icon} {haz.short}
                      </span>
                    </td>
                    <td style={{padding:"6px 8px",color:"#38bdf8"}}>{c.rack}</td>
                    <td style={{padding:"6px 8px"}}>
                      <div style={{display:"flex",gap:"3px"}}>
                        <button onClick={e=>{e.stopPropagation();onEdit(c);}} className="btn-hover"
                          style={{background:"#1e40af",color:"#bfdbfe",border:"none",borderRadius:"5px",padding:"3px 8px",cursor:"pointer",fontSize:"9px",whiteSpace:"nowrap"}}>✏️ Edit</button>
                        <button onClick={e=>{e.stopPropagation();onOut(c);}} className="btn-hover"
                          style={{background:"#7f1d1d",color:"#fca5a5",border:"none",borderRadius:"5px",padding:"3px 8px",cursor:"pointer",fontSize:"9px",whiteSpace:"nowrap"}}>📤 OUT</button>
                      </div>
                    </td>
                  </tr>
                  {isEx&&(
                    <tr key={`x${c.docId}`}>
                      <td colSpan={13} style={{padding:0,background:"#070f1e"}}>
                        <div style={{padding:"10px 16px",borderBottom:"1px solid #1e3a5f",animation:"fadeIn .3s ease"}}>
                          <div style={{color:"#38bdf8",fontSize:"10px",fontWeight:"700",marginBottom:"8px"}}>
                            📋 LEDGER — {c.name} (WAC: {fmtCur(currentWAC,c.currency)}/{c.unit})
                          </div>
                          <table style={{width:"100%",borderCollapse:"collapse",fontSize:"9px"}}>
                            <thead><tr>{["Date","Action","Qty","Price/Unit","WAC After","Before Bal.","After Bal.","By","Note"].map(h=>(
                              <th key={h} style={{padding:"4px 7px",color:"#64748b",textAlign:"left",whiteSpace:"nowrap"}}>{h}</th>
                            ))}</tr></thead>
                            <tbody>
                              <tr style={{background:"#0e2236"}}>
                                <td style={{padding:"4px 7px",color:"#475569"}}>—</td>
                                <td colSpan={2} style={{padding:"4px 7px",color:"#22d3ee",fontWeight:"700"}}>📂 OPENING</td>
                                <td colSpan={3}/>
                                <td style={{padding:"4px 7px",color:"#22d3ee",fontWeight:"900"}}>{opening} {c.unit}</td>
                                <td colSpan={2}/>

                              {ledger.map((l,li)=>(
                                <tr key={l.docId||li} style={{background:li%2===0?"#0a1628":"transparent"}}>
                                  <td style={{padding:"4px 7px",color:"#64748b"}}>{l.date}</td>
                                  <td style={{padding:"4px 7px"}}>
                                    <span style={{background:l.action==="IN"?"#15803d33":"#dc262633",color:l.action==="IN"?"#4ade80":"#f87171",borderRadius:"3px",padding:"1px 5px",fontWeight:"700"}}>{l.action}</span>

                                  <td style={{padding:"4px 7px",color:"#94a3b8"}}>{l.before} {c.unit}</td>
                                  <td style={{padding:"4px 7px",color:"#fbbf24",fontWeight:"700"}}>{l.after} {c.unit}</td>

                                </tr>
                              ))}
                              <tr style={{borderTop:"2px solid #1e3a5f"}}>
                                <td style={{padding:"6px 7px",color:"#475569"}}>—</td>
                                <td colSpan={2} style={{padding:"6px 7px",color:"#fbbf24",fontWeight:"700"}}>🔒 CLOSING</td>
                                <td colSpan={3}/>

                                <td colSpan={2} style={{padding:"6px 7px",color:"#4ade80",fontSize:"9px"}}>Value: {fmtCur(closing*currentWAC,c.currency)}</td>

        </table>
        {filtered.length===0&&<div style={{textAlign:"center",color:"#475569",padding:"24px"}}>No results found</div>}

  );
}

// ── COMPATIBILITY CHART ───────────────────────────────────────────────────────
function CompatChart({chemicals,racks,logs}){
  const[mode,setMode]=useState("rack");
  const keys=Object.keys(COMPAT_MATRIX);
  const getRackStatus=chems=>{
    for(let i=0;i<chems.length;i++)for(let j=i+1;j<chems.length;j++){
      const h1=chems[i].hazardClass||"NONE",h2=chems[j].hazardClass||"NONE";
      if(COMPAT_MATRIX[h1]?.[h2]===false)return"DANGER";
      if(COMPAT_MATRIX[h1]?.[h2]==="caution")return"CAUTION";
    }
    return"OK";
  };
  const occupied=racks.map(r=>({rack:r,chems:chemicals.filter(c=>c.rack===r&&c.status==="IN")})).filter(r=>r.chems.length>0);

            const st=getRackStatus(chems);

            const conflicts=[];
            for(let i=0;i<chems.length;i++)for(let j=i+1;j<chems.length;j++){

        </div>
      )}
    </div>
  );
}

// ── PRODUCTION ISSUE MODULE ───────────────────────────────────────────────────
function ProductionModule({chemicals,logs,onIssue}){
  const[recipe,setRecipe]=useState([{chemId:"",chemName:"",doseGmL:"",unit:"g"}]);
  const[liquorRatio,setLiquorRatio]=useState(10);
  const[fabricKg,setFabricKg]=useState("");
  const[result,setResult]=useState(null);
  const[batchNo,setBatchNo]=useState(`BT-${new Date().toISOString().slice(0,10)}-001`);

  const inStock=chemicals.filter(c=>c.status==="IN");

  const addRecipeLine=()=>setRecipe(p=>[...p,{chemId:"",chemName:"",doseGmL:"",unit:"g"}]);
  const removeRecipeLine=i=>setRecipe(p=>p.filter((_,idx)=>idx!==i));
  const setLine=(i,k,v)=>setRecipe(p=>p.map((r,idx)=>idx===i?{...r,[k]:v}:r));

  const calculate=()=>{
    const fab=parseFloat(fabricKg);
    const lr=parseFloat(liquorRatio);
    if(!fab||isNaN(fab)||!lr||isNaN(lr)){alert("Please enter fabric weight and liquor ratio!");return;}
    const totalLiquor=fab*lr; // liters
    const lines=recipe.map(r=>{
      const chem=inStock.find(c=>c.id===Number(r.chemId)||c.docId===r.chemId);
      const dose=parseFloat(r.doseGmL)||0;
      const totalGm=dose*totalLiquor;
      const totalKg=totalGm/1000;
      const{closing}=chem?buildLedger(chem,logs):{closing:0};
      const sufficient=closing>=totalKg;
      return{...r,chem,dose,totalLiquor,totalGm,totalKg,closing,sufficient};
    }).filter(r=>r.chem);
    setResult({lines,fabricKg:fab,liquorRatio:lr,totalLiquor,batchNo});
  };

  const issueAll=async()=>{
    if(!result)return;
    const insufficient=result.lines.filter(r=>!r.sufficient);
    if(insufficient.length>0){
      alert(`⛔ Insufficient stock:\n${insufficient.map(r=>`• ${r.chem.name}: Need ${r.totalKg.toFixed(2)}kg, Have ${r.closing}kg`).join("\n")}`);
      return;
    }
    if(!window.confirm(`Issue chemicals for Batch ${result.batchNo}?\n\n${result.lines.map(r=>`• ${r.chem.name}: ${r.totalKg.toFixed(3)} kg`).join("\n")}`))return;
    for(const r of result.lines){
      await onIssue(r.chem,r.totalKg,result.batchNo);
    }
    alert("✅ Production issue complete!");
    setResult(null);
    setRecipe([{chemId:"",chemName:"",doseGmL:"",unit:"g"}]);
    setFabricKg("");
  };

  return(
    <div style={{padding:"14px 20px"}}>
      <div style={{background:"linear-gradient(135deg,#0f2440,#1e3a5f)",borderRadius:"12px",padding:"16px 18px",border:"1px solid #1e3a5f",marginBottom:"14px"}}>
        <div style={{color:"#38bdf8",fontSize:"14px",fontWeight:"700",letterSpacing:"1px",marginBottom:"4px"}}>🧪 Production Issue Module</div>
        <div style={{color:"#475569",fontSize:"10px"}}>Enter dyeing recipe → Calculate chemical requirements → Issue from stock</div>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"10px",marginBottom:"14px"}}>
        {[["Batch No",batchNo,setBatchNo,"text"],["Fabric Weight (kg)",fabricKg,setFabricKg,"number"],["Liquor Ratio (L/kg)",liquorRatio,(v)=>setLiquorRatio(v),"number"]].map(([label,val,setter,type])=>(
          <div key={label}>
            <div style={{color:"#64748b",fontSize:"9px",marginBottom:"4px"}}>{label}</div>
            <input type={type} value={val} onChange={e=>setter(e.target.value)}
              autoComplete="off" spellCheck="false"
              style={{width:"100%",background:"#1e293b",border:"1px solid #334155",borderRadius:"7px",padding:"8px 10px",color:"#e2e8f0",fontSize:"13px",boxSizing:"border-box"}}/>
          </div>
        ))}
      </div>

      <div style={{color:"#94a3b8",fontSize:"11px",fontWeight:"700",marginBottom:"8px"}}>
        📋 Recipe (dose in g/L of liquor):
      </div>

      {recipe.map((r,i)=>(
        <div key={i} style={{display:"flex",gap:"6px",marginBottom:"7px",alignItems:"center",background:"#0f172a",borderRadius:"8px",padding:"8px 10px",border:"1px solid #1e293b"}}>
          <div style={{flex:2,minWidth:0}}>
            <div style={{color:"#64748b",fontSize:"8px",marginBottom:"3px"}}>Chemical</div>
            <select value={r.chemId} onChange={e=>{
              const c=inStock.find(x=>x.docId===e.target.value||String(x.id)===e.target.value);
              setLine(i,"chemId",e.target.value);
              setLine(i,"chemName",c?.name||"");
            }} style={{width:"100%",background:"#1e293b",border:"1px solid #334155",borderRadius:"6px",padding:"7px 8px",color:"#e2e8f0",fontSize:"11px"}}>
              <option value="">Select chemical…</option>
              {inStock.map(c=>(
                <option key={c.docId||c.id} value={c.docId||String(c.id)}>{c.name} ({c.code}) — {c.amount}{c.unit}</option>
              ))}
            </select>
          </div>
          <div style={{width:"90px"}}>
            <div style={{color:"#64748b",fontSize:"8px",marginBottom:"3px"}}>Dose (g/L)</div>
            <input type="number" value={r.doseGmL} onChange={e=>setLine(i,"doseGmL",e.target.value)}
              autoComplete="off"
              style={{width:"100%",background:"#1e293b",border:"1px solid #334155",borderRadius:"6px",padding:"7px 8px",color:"#e2e8f0",fontSize:"12px"}}/>
          </div>
          <button onClick={()=>removeRecipeLine(i)} style={{background:"#7f1d1d",color:"#fca5a5",border:"none",borderRadius:"5px",padding:"6px 10px",cursor:"pointer",fontSize:"12px",marginTop:"14px"}}>✕</button>
        </div>
      ))}

      <div style={{display:"flex",gap:"8px",marginTop:"10px",marginBottom:"16px"}}>
        <button onClick={addRecipeLine} className="btn-hover"
          style={{background:"#1e293b",color:"#94a3b8",border:"1px solid #334155",borderRadius:"7px",padding:"8px 14px",cursor:"pointer",fontSize:"11px"}}>
          + Add Chemical
        </button>
        <button onClick={calculate} className="btn-hover"
          style={{background:"linear-gradient(135deg,#0284c7,#0369a1)",color:"#fff",border:"none",borderRadius:"7px",padding:"8px 18px",cursor:"pointer",fontSize:"11px",fontWeight:"700"}}>
          🧮 Calculate
        </button>
      </div>

      {result&&(
        <div style={{background:"#0f172a",borderRadius:"12px",padding:"16px",border:"1px solid #1e3a5f",animation:"fadeIn .4s ease"}}>
          <div style={{color:"#38bdf8",fontSize:"13px",fontWeight:"700",marginBottom:"12px"}}>
            📊 Calculation Result — {result.batchNo} | Fabric: {result.fabricKg}kg | Liquor: {result.totalLiquor.toFixed(0)}L
          </div>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:"10px",marginBottom:"14px"}}>
            <thead>
              <tr style={{background:"#1e293b"}}>
                {["Chemical","Dose g/L","Total Volume L","Need (g)","Need (kg)","Stock","Status"].map(h=>(
                  <th key={h} style={{padding:"7px 8px",color:"#94a3b8",textAlign:"left",whiteSpace:"nowrap"}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {result.lines.map((r,i)=>(
                <tr key={i} style={{background:i%2===0?"#0a1628":"#0f172a",borderBottom:"1px solid #1e293b"}}>
                  <td style={{padding:"7px 8px",color:"#e2e8f0",fontWeight:"700"}}>{r.chem.name}</td>
                  <td style={{padding:"7px 8px",color:"#94a3b8"}}>{r.dose} g/L</td>
                  <td style={{padding:"7px 8px",color:"#94a3b8"}}>{r.totalLiquor.toFixed(1)} L</td>
                  <td style={{padding:"7px 8px",color:"#fbbf24",fontWeight:"700"}}>{r.totalGm.toFixed(1)} g</td>
                  <td style={{padding:"7px 8px",color:"#38bdf8",fontWeight:"700"}}>{r.totalKg.toFixed(3)} kg</td>
                  <td style={{padding:"7px 8px",color:"#94a3b8"}}>{r.closing} {r.chem.unit}</td>
                  <td style={{padding:"7px 8px"}}>
                    <span style={{background:r.sufficient?"#14532d":"#7f1d1d",color:r.sufficient?"#4ade80":"#fca5a5",borderRadius:"4px",padding:"2px 8px",fontSize:"10px",fontWeight:"700"}}>
                      {r.sufficient?"✅ OK":"⛔ SHORT"}
                    </span>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
          <button onClick={issueAll} className="btn-hover"
            style={{background:result.lines.every(r=>r.sufficient)?"linear-gradient(135deg,#166534,#15803d)":"#450a0a",
              color:result.lines.every(r=>r.sufficient)?"#4ade80":"#fca5a5",
              border:"none",borderRadius:"8px",padding:"12px 24px",cursor:"pointer",fontSize:"12px",fontWeight:"700",width:"100%"}}>
            {result.lines.every(r=>r.sufficient)?"📤 Issue All from Stock":"⛔ Cannot Issue — Insufficient Stock"}
          </button>
        </div>
      )}
    </div>
  );
}

// ── CONFLICT MODAL ────────────────────────────────────────────────────────────
function ConflictModal({conflicts,safeRacks,onClose,onForce}){
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.9)",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center",padding:"12px"}}>
      <div style={{background:"#1a0505",border:"3px solid #ef4444",borderRadius:"16px",padding:"24px",width:"min(520px,96vw)",animation:"fadeIn .3s ease",boxShadow:"0 0 60px #ef444433"}}>
        <div style={{fontSize:"32px",textAlign:"center",marginBottom:"12px",animation:"alertPulse 1s infinite"}}>⛔</div>
        <div style={{color:"#ef4444",fontSize:"18px",fontWeight:"900",textAlign:"center",marginBottom:"8px",letterSpacing:"1px"}}>
          SAFETY CONFLICT DETECTED
        </div>
        <div style={{color:"#fca5a5",fontSize:"12px",textAlign:"center",marginBottom:"20px"}}>
          The following chemicals are INCOMPATIBLE and must NEVER be stored together!
        </div>
        {conflicts.map((cf,i)=>(
          <div key={i} style={{background:"#7f1d1d",borderRadius:"8px",padding:"12px 14px",marginBottom:"8px",border:"1px solid #ef4444"}}>
            <div style={{color:"#fca5a5",fontSize:"11px",fontWeight:"700"}}>
              {HAZARD_CLASSES[cf.h1]?.icon} {cf.a} ({cf.h1})
              <span style={{color:"#ef4444",margin:"0 8px",fontSize:"14px"}}>✗</span>
              {HAZARD_CLASSES[cf.h2]?.icon} {cf.b} ({cf.h2})
            </div>
            <div style={{color:"#94a3b8",fontSize:"9px",marginTop:"4px"}}>
              {cf.reason||"These chemical classes are incompatible — risk of fire, explosion or toxic reaction"}
            </div>
          </div>
        ))}
        {safeRacks.length>0&&(
          <div style={{background:"#14532d33",border:"1px solid #4ade8044",borderRadius:"8px",padding:"10px 14px",marginBottom:"16px"}}>
            <div style={{color:"#4ade80",fontSize:"10px",fontWeight:"700",marginBottom:"4px"}}>✅ Safe racks available:</div>
            <div style={{color:"#4ade80",fontSize:"11px"}}>{safeRacks.slice(0,8).join(" · ")}</div>
          </div>
        )}
        <div style={{display:"flex",gap:"10px"}}>
          <button onClick={onClose} style={{flex:2,background:"linear-gradient(135deg,#0284c7,#0369a1)",color:"#fff",border:"none",borderRadius:"8px",padding:"12px",cursor:"pointer",fontSize:"12px",fontWeight:"700"}}>
            ← Choose Different Rack
          </button>
        </div>
      </div>
    </div>
  );
}

// ── ADD/EDIT MODAL ────────────────────────────────────────────────────────────
function ChemModal({chem,chemicals,racks,logs,onSave,onLog,onClose,onAddRack}){
  const isEdit=!!chem.docId;
  const isOutMode=chem._outMode===true;
  const today=new Date().toISOString().split("T")[0];
  const formRef=useRef(null);

  const[form,setForm]=useState({
    docId:chem.docId||null,
    id:chem.id||genId(),
    code:chem.code||"",name:chem.name||"",type:chem.type||"CHEMICAL",
    hazardClass:chem.hazardClass||"NONE",
    hazards:chem.hazards||["NONE"],
    lotNo:chem.lotNo||"",expDate:chem.expDate||"",
    openingBalance:chem.openingBalance??0,
    amount:chem.amount??0,unit:chem.unit||"kg",
    pricePerUnit:chem.pricePerUnit??0,currency:chem.currency||"BDT",
    supplier:chem.supplier||"",containerType:chem.containerType||"Drum",
    containerCapacity:chem.containerCapacity??0,containerCount:chem.containerCount??0,
    rack:chem.rack||racks[0]||"A-01",dateIn:chem.dateIn||today,
    dateOut:chem.dateOut||"",status:isOutMode?"OUT":chem.status||"IN",
    lowStockThreshold:chem.lowStockThreshold??50,
    outAmount:0,
  });
  const[newRack,setNewRack]=useState("");
  const[showNewRack,setShowNewRack]=useState(false);
  const[conflict,setConflict]=useState(null);
  const[qs,setQs]=useState(chem.name||"");
  const set=(k,v)=>setForm(p=>({...p,[k]:v}));

  // Quick fill for OUT mode
  const qsFill=(val)=>{
    setQs(val);
    const f=chemicals.find(c=>c.name?.toLowerCase().includes(val.toLowerCase())||c.code?.toLowerCase()===val.toLowerCase());
    if(f)setForm(p=>({...p,...f,docId:f.docId,status:"OUT",outAmount:0,dateOut:today}));
  };

  // Check rack compatibility
  const primary=form.hazardClass||"NONE";
  const sameRack=chemicals.filter(c=>c.rack===form.rack&&c.status==="IN"&&c.docId!==form.docId);
  const hardConflicts=sameRack.filter(c=>COMPAT_MATRIX[primary]?.[c.hazardClass||"NONE"]===false);
  const cautionList=sameRack.filter(c=>COMPAT_MATRIX[primary]?.[c.hazardClass||"NONE"]==="caution");
  const blocked=hardConflicts.length>0&&(form.status==="IN"||isOutMode===false);
  const safeRacks=racks.filter(r=>{
    const occ=chemicals.filter(c=>c.rack===r&&c.status==="IN"&&c.docId!==form.docId);
    return occ.every(c=>COMPAT_MATRIX[primary]?.[c.hazardClass||"NONE"]!==false);
  });

  const handleSave=()=>{
    // Collect DOM input values
    const finalForm={...form};
    if(formRef.current){
      formRef.current.querySelectorAll("input[data-key]").forEach(inp=>{
        const k=inp.getAttribute("data-key");
        const isNum=inp.getAttribute("data-type")==="number";
        if(k)finalForm[k]=isNum?(inp.value===""?0:Number(inp.value)):inp.value;
      });
    }
    finalForm.docId=form.docId;

    if(isOutMode){
      // OUT mode: just add log, don't update chemical record
      const outAmt=Number(finalForm.outAmount)||0;
      if(outAmt<=0){alert("Please enter amount to issue!");return;}
      const{closing}=buildLedger(chem,logs);
      if(outAmt>closing){alert(`⛔ Insufficient stock!\nAvailable: ${closing} ${chem.unit}\nRequested: ${outAmt} ${chem.unit}`);return;}
      onLog({id:genId(),date:finalForm.dateOut||today,chemId:chem.id,chemCode:chem.code,
        chemName:chem.name,action:"OUT",amount:outAmt,unit:chem.unit,
        containerCount:0,lotNo:chem.lotNo||"",note:finalForm.outNote||"Stock issued",by:"Store",
        pricePerUnit:finalForm.pricePerUnit||chem.pricePerUnit});
      onClose();
      return;
    }

    // Check compatibility
    if(blocked){
      setConflict({
        conflicts:hardConflicts.map(c=>({h1:primary,h2:c.hazardClass||"NONE",a:form.name||"New Item",b:c.name})),
        safeRacks
      });
      return;
    }

    onSave(finalForm);
    if(!isEdit){
      onLog({id:genId(),date:finalForm.dateIn||today,chemId:finalForm.id,chemCode:finalForm.code,
        chemName:finalForm.name,action:"IN",amount:Number(finalForm.amount),unit:finalForm.unit,
        containerCount:Number(finalForm.containerCount),lotNo:finalForm.lotNo,
        note:"Initial stock",by:"Store",pricePerUnit:finalForm.pricePerUnit});
    }
    onClose();
  };

  const inp=(label,k,type="text",full=false,color="")=>{
    const isNum=type==="number";
    const isDate=type==="date";
    if(isDate)return(
      <div style={{marginBottom:"10px",gridColumn:full?"1/-1":""}}>
        <div style={{color:"#64748b",fontSize:"9px",marginBottom:"3px"}}>{label}</div>
        <input type="date" value={form[k]||""} onChange={e=>set(k,e.target.value)}
          style={{width:"100%",background:"#1e293b",border:"1px solid #334155",borderRadius:"7px",padding:"8px 10px",color:"#e2e8f0",fontSize:"13px",boxSizing:"border-box"}}/>
      </div>
    );
    return(
      <div style={{marginBottom:"10px",gridColumn:full?"1/-1":""}}>
        <div style={{color:"#64748b",fontSize:"9px",marginBottom:"3px"}}>{label}</div>
        <input data-key={k} data-type={isNum?"number":"text"} type="text"
          inputMode={isNum?"decimal":"text"} defaultValue={isNum?(form[k]||""):form[k]}
          placeholder={isNum?"0":""} autoComplete="off" autoCorrect="off" autoCapitalize="off" spellCheck="false"
          onBlur={e=>{const v=e.target.value;set(k,isNum?(v===""?0:Number(v.replace(/[^0-9.]/g,""))):v);}}
          style={{width:"100%",background:"#1e293b",border:`1px solid ${color||"#334155"}`,borderRadius:"7px",padding:"8px 10px",color:color||"#e2e8f0",fontSize:"14px",boxSizing:"border-box"}}/>
      </div>
    );
  };

  const sel=(label,k,opts,full=false)=>(
    <div style={{marginBottom:"10px",gridColumn:full?"1/-1":""}}>
      <div style={{color:"#64748b",fontSize:"9px",marginBottom:"3px"}}>{label}</div>
      <select value={form[k]} onChange={e=>set(k,e.target.value)}
        style={{width:"100%",background:"#1e293b",border:"1px solid #334155",borderRadius:"7px",padding:"8px 10px",color:"#e2e8f0",fontSize:"13px"}}>
        {opts.map(o=><option key={o.v||o} value={o.v||o}>{o.l||o}</option>)}
      </select>
    </div>
  );

  const modalTitle=isOutMode?"📤 ISSUE STOCK (OUT)":isEdit?`✏️ EDIT: ${chem.name}`:"➕ ADD CHEMICAL / DYE";

  return(
    <>
      {conflict&&<ConflictModal conflicts={conflict.conflicts} safeRacks={conflict.safeRacks} onClose={()=>setConflict(null)}/>}
      <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.88)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:"8px"}}
        onClick={e=>e.target===e.currentTarget&&onClose()}>
        <div ref={formRef} style={{background:"#0a1628",border:"1px solid #1e3a5f",borderRadius:"16px",padding:"22px",width:"min(600px,98vw)",maxHeight:"92vh",overflowY:"auto",boxShadow:"0 24px 80px #000a"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"16px"}}>
            <div style={{color:"#38bdf8",fontSize:"14px",fontWeight:"700",letterSpacing:"1px"}}>{modalTitle}</div>
            <button onClick={onClose} style={{background:"none",border:"none",color:"#64748b",cursor:"pointer",fontSize:"20px"}}>✕</button>
          </div>

          {/* OUT MODE */}
          {isOutMode&&(
            <div>
              <div style={{background:"#7f1d1d22",border:"1px solid #f8717144",borderRadius:"8px",padding:"12px",marginBottom:"14px"}}>
                <div style={{color:"#f87171",fontWeight:"700",marginBottom:"4px"}}>📤 Issue: {chem.name}</div>
                <div style={{color:"#94a3b8",fontSize:"10px"}}>Code: {chem.code} · Rack: {chem.rack} · Available: {buildLedger(chem,logs).closing} {chem.unit}</div>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 12px"}}>
                <div style={{marginBottom:"10px"}}>
                  <div style={{color:"#64748b",fontSize:"9px",marginBottom:"3px"}}>AMOUNT TO ISSUE ({chem.unit})</div>
                  <input type="text" inputMode="decimal" data-key="outAmount" data-type="number"
                    defaultValue="" placeholder="0" autoComplete="off"
                    onBlur={e=>set("outAmount",e.target.value===""?0:Number(e.target.value))}
                    style={{width:"100%",background:"#1e293b",border:"1px solid #f87171",borderRadius:"7px",padding:"9px 10px",color:"#f87171",fontSize:"16px",boxSizing:"border-box",fontWeight:"700"}}/>
                </div>
                {inp("DATE OUT","dateOut","date")}
                <div style={{gridColumn:"1/-1",marginBottom:"10px"}}>
                  <div style={{color:"#64748b",fontSize:"9px",marginBottom:"3px"}}>NOTE / PURPOSE</div>
                  <input data-key="outNote" data-type="text" type="text" defaultValue=""
                    placeholder="e.g. Batch #BT-001, Production use…" autoComplete="off" spellCheck="false"
                    onBlur={e=>set("outNote",e.target.value)}
                    style={{width:"100%",background:"#1e293b",border:"1px solid #334155",borderRadius:"7px",padding:"9px 10px",color:"#e2e8f0",fontSize:"14px",boxSizing:"border-box"}}/>
                </div>
              </div>
            </div>
          )}

          {/* ADD / EDIT MODE */}
          {!isOutMode&&(
            <>
              {!isEdit&&(
                <div style={{marginBottom:"12px"}}>
                  <div style={{color:"#64748b",fontSize:"9px",marginBottom:"4px"}}>QUICK FILL (type name/code for OUT):</div>
                  <input value={qs} onChange={e=>qsFill(e.target.value)} placeholder="Start typing name or code…"
                    autoComplete="off" spellCheck="false"
                    style={{width:"100%",background:"#1e293b",border:"1px solid #334155",borderRadius:"7px",padding:"9px 10px",color:"#e2e8f0",fontSize:"14px",boxSizing:"border-box"}}/>
                </div>
              )}

              {blocked&&(
                <div style={{background:"#450a0a",border:"2px solid #ef4444",borderRadius:"10px",padding:"12px",marginBottom:"12px"}}>
                  <div style={{color:"#fca5a5",fontWeight:"800",fontSize:"13px",marginBottom:"4px"}}>⛔ SAVE BLOCKED — INCOMPATIBLE RACK!</div>
                  {hardConflicts.map(c=><div key={c.docId} style={{color:"#f87171",fontSize:"11px"}}>• {c.name} [{c.hazardClass}]</div>)}
                  <div style={{color:"#fbbf24",fontSize:"10px",marginTop:"6px"}}>✅ Safe racks: {safeRacks.slice(0,6).join(" · ")}</div>
                </div>
              )}
              {!blocked&&cautionList.length>0&&(
                <div style={{background:"#451a03",border:"1px solid #f59e0b",borderRadius:"8px",padding:"8px 12px",marginBottom:"10px",color:"#fcd34d",fontSize:"10px"}}>
                  ⚠️ CAUTION: {cautionList.map(c=>c.name).join(", ")} — Separate if possible
                </div>
              )}

              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 12px"}}>
                {inp("CHEMICAL CODE","code")}
                {inp("CHEMICAL / DYE NAME","name")}
                {sel("TYPE","type",[{v:"CHEMICAL",l:"Chemical"},{v:"DYE",l:"Dye"}])}
                {sel("STATUS","status",[{v:"IN",l:"📥 IN Stock"},{v:"OUT",l:"📤 OUT / Issued"}])}
                {inp("LOT NUMBER","lotNo")}
                {inp("EXPIRY DATE","expDate","date")}
                {inp("OPENING BALANCE","openingBalance","number",true,"#22d3ee66")}

                {/* HAZARD CLASS */}
                <div style={{gridColumn:"1/-1",marginBottom:"10px"}}>
                  <div style={{color:"#64748b",fontSize:"9px",marginBottom:"5px"}}>HAZARD CLASS (GHS)</div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:"5px"}}>
                    {Object.entries(HAZARD_CLASSES).map(([k,v])=>(
                      <button key={k} onClick={()=>set("hazardClass",k)}
                        style={{padding:"5px 10px",borderRadius:"6px",border:`1px solid ${form.hazardClass===k?v.color:"#334155"}`,cursor:"pointer",fontSize:"10px",
                          background:form.hazardClass===k?v.color+"33":"#1e293b",color:form.hazardClass===k?v.color:"#64748b",display:"flex",alignItems:"center",gap:"4px"}}>
                        {v.icon} {v.label.split("(")[0].trim()} <span style={{fontWeight:"700"}}>({v.short})</span>
                      </button>
                    ))}
                  </div>
                </div>

                {/* Amount + Unit */}
                <div style={{marginBottom:"10px"}}>
                  <div style={{color:"#64748b",fontSize:"9px",marginBottom:"3px"}}>AMOUNT</div>
                  <div style={{display:"flex",gap:"5px"}}>
                    <input type="text" inputMode="decimal" data-key="amount" data-type="number"
                      defaultValue={form.amount||""} placeholder="0" autoComplete="off"
                      onBlur={e=>set("amount",e.target.value===""?0:Number(e.target.value))}
                      style={{flex:1,background:"#1e293b",border:"1px solid #334155",borderRadius:"7px",padding:"8px 10px",color:"#e2e8f0",fontSize:"14px"}}/>
                    <select value={form.unit} onChange={e=>set("unit",e.target.value)}
                      style={{background:"#1e293b",border:"1px solid #334155",borderRadius:"7px",padding:"8px 10px",color:"#38bdf8",fontSize:"13px"}}>
                      {UNITS.map(u=><option key={u} value={u}>{u}</option>)}
                    </select>
                  </div>
                  {/* Unit conversion hint */}
                  {(form.unit==="g"||form.unit==="mL")&&form.amount>0&&(
                    <div style={{fontSize:"9px",color:"#475569",marginTop:"2px"}}>
                      = {(form.amount/1000).toFixed(3)} {form.unit==="g"?"kg":"L"}
                    </div>
                  )}
                </div>

                {/* Price + Currency + WAC hint */}
                <div style={{marginBottom:"10px"}}>
                  <div style={{color:"#64748b",fontSize:"9px",marginBottom:"3px"}}>PRICE / {form.unit}</div>
                  <div style={{display:"flex",gap:"5px"}}>
                    <input type="text" inputMode="decimal" data-key="pricePerUnit" data-type="number"
                      defaultValue={form.pricePerUnit||""} placeholder="0" autoComplete="off"
                      onBlur={e=>set("pricePerUnit",e.target.value===""?0:Number(e.target.value))}
                      style={{flex:1,background:"#1e293b",border:"1px solid #334155",borderRadius:"7px",padding:"8px 10px",color:"#e2e8f0",fontSize:"14px"}}/>
                    <select value={form.currency} onChange={e=>set("currency",e.target.value)}
                      style={{background:"#1e293b",border:"1px solid #334155",borderRadius:"7px",padding:"8px 10px",color:"#fbbf24",fontSize:"13px",fontWeight:"700"}}>
                      {CURRENCIES.map(c=><option key={c.v} value={c.v}>{c.v} {c.sym}</option>)}
                    </select>
                  </div>
                  {/* WAC preview for IN */}
                  {!isEdit&&form.status==="IN"&&form.amount>0&&form.pricePerUnit>0&&(()=>{
                    const existing=chemicals.find(c=>c.code===form.code&&c.status==="IN");
                    if(existing){
                      const{closing,currentWAC}=buildLedger(existing,logs);
                      const newWAC=calcWAC(closing,currentWAC,form.amount,form.pricePerUnit);
                      return(<div style={{fontSize:"9px",color:"#a78bfa",marginTop:"2px"}}>
                        WAC: {fmtCur(currentWAC,form.currency)} → {fmtCur(newWAC,form.currency)}/{form.unit} (after this IN)
                      </div>);
                    }
                    return null;
                  })()}
                </div>

                {inp("SUPPLIER","supplier",undefined,true)}
                {sel("CONTAINER","containerType",CONTAINERS)}
                {inp(`CAPACITY/${form.containerType} (${form.unit})`,"containerCapacity","number")}
                {inp(`No. of ${form.containerType}s`,"containerCount","number")}
                {inp(`LOW STOCK THRESHOLD (${form.unit})`,"lowStockThreshold","number",true)}

                {/* Rack */}
                <div style={{gridColumn:"1/-1",marginBottom:"10px"}}>
                  <div style={{color:"#64748b",fontSize:"9px",marginBottom:"3px"}}>ROW / RACK</div>
                  <div style={{display:"flex",gap:"6px"}}>
                    <select value={form.rack} onChange={e=>set("rack",e.target.value)}
                      style={{flex:1,background:"#1e293b",border:`1px solid ${blocked?"#ef4444":cautionList.length?"#f59e0b":"#334155"}`,borderRadius:"7px",padding:"8px 10px",color:"#e2e8f0",fontSize:"13px"}}>
                      {racks.map(r=>{
                        const occ=chemicals.filter(c=>c.rack===r&&c.status==="IN"&&c.docId!==form.docId);
                        const blk=occ.some(c=>COMPAT_MATRIX[primary]?.[c.hazardClass||"NONE"]===false);
                        const wrn=!blk&&occ.some(c=>COMPAT_MATRIX[primary]?.[c.hazardClass||"NONE"]==="caution");
                        return<option key={r} value={r}>{r}{blk?" ⛔ BLOCKED":wrn?" ⚠️ Caution":occ.length?" ✅ Safe":""}</option>;
                      })}
                    </select>
                    <button onClick={()=>setShowNewRack(v=>!v)}
                      style={{background:"#1e293b",border:"1px solid #334155",borderRadius:"7px",padding:"8px 12px",cursor:"pointer",color:"#94a3b8",fontSize:"11px",whiteSpace:"nowrap"}}>+ Rack</button>
                  </div>
                  {showNewRack&&<div style={{display:"flex",gap:"6px",marginTop:"6px"}}>
                    <input value={newRack} onChange={e=>setNewRack(e.target.value.toUpperCase())} placeholder="e.g. F-01"
                      style={{flex:1,background:"#1e293b",border:"1px solid #334155",borderRadius:"6px",padding:"7px 10px",color:"#e2e8f0",fontSize:"13px"}}/>
                    <button onClick={()=>{if(newRack.trim()){onAddRack(newRack.trim());set("rack",newRack.trim());setNewRack("");setShowNewRack(false);}}}
                      style={{background:"#0284c7",color:"#fff",border:"none",borderRadius:"6px",padding:"7px 12px",cursor:"pointer",fontSize:"12px"}}>Add</button>
                  </div>}
                </div>
                {inp("DATE IN","dateIn","date")}
                {form.status==="OUT"&&inp("DATE OUT","dateOut","date")}
              </div>
            </>
          )}

          <div style={{display:"flex",gap:"8px",marginTop:"16px"}}>
            <button onClick={handleSave}
              style={{flex:1,background:blocked?"#450a0a":isOutMode?"linear-gradient(135deg,#7f1d1d,#991b1b)":"linear-gradient(135deg,#0284c7,#0369a1)",
                color:blocked?"#fca5a5":"#fff",border:blocked?"2px solid #ef4444":"none",
                borderRadius:"10px",padding:"13px",cursor:blocked?"not-allowed":"pointer",fontSize:"13px",fontWeight:"700"}}>
              {blocked?"⛔ BLOCKED — Change Rack":isOutMode?"📤 ISSUE STOCK":isEdit?"💾 UPDATE":"💾 SAVE TO FIREBASE"}
            </button>
            <button onClick={onClose} style={{flex:1,background:"#1e293b",color:"#94a3b8",border:"1px solid #334155",borderRadius:"10px",padding:"13px",cursor:"pointer",fontSize:"13px"}}>CANCEL</button>
          </div>
        </div>
      </div>
    </>
  );
}

// ── MAIN APP ──────────────────────────────────────────────────────────────────
function App(){

  const[saving,setSaving]=useState(false);
  const[dbStatus,setDbStatus]=useState("connecting");
  const[tgModal,setTgModal]=useState(false);
  const[alertSent,setAlertSent]=useState(null);

        add:"➕ যোগ করুন",alertOn:"🤖 Alert ON",alertOff:"🤖 Alert",
        totalStock:"মোট স্টক",lowStock2:"কম স্টক",expiring:"মেয়াদ শেষ",valueBdt:"মূল্য BDT",valueUsd:"মূল্য USD",totalLogs:"মোট লগ"},
    en:{warehouse:"🏭 Warehouse",stock:"📋 Stock Ledger",log:"📜 IN/OUT Log",production:"🧪 Production",
        compat:"⚠️ Compatibility",alerts:"🔴 Alerts",settings:"⚙️ Settings",
        add:"➕ Add",alertOn:"🤖 Alert ON",alertOff:"🤖 Alert",
        totalStock:"Total Stock",lowStock2:"Low Stock",expiring:"Expiring",valueBdt:"Value BDT",valueUsd:"Value USD",totalLogs:"Total Logs"},
  };
  const tx=T[lang];
  const isDark=theme==="dark";
  React.useEffect(()=>{
    document.body.style.background=isDark?"#020c1b":"#f0f4f8";
    document.body.style.color=isDark?"#e2e8f0":"#1a202c";
    localStorage.setItem("chemstore_theme",theme);
    if(isDark){
      document.body.classList.remove("light-theme");
    } else {
      document.body.classList.add("light-theme");
    }
  },[theme]);
  React.useEffect(()=>{localStorage.setItem("chemstore_lang",lang);},[lang]);

  const loadData=useCallback(async()=>{
    try{
      setDbStatus("connecting");
      const[chems,lg]=await Promise.all([fsGet("chemicals"),fsGet("logs")]);
      setChemicals(chems);
      setLogs(lg.sort((a,b)=>(a.date||"").localeCompare(b.date||"")));
      setDbStatus("online");
    }catch(e){console.error(e);setDbStatus("offline");}
    finally{setLoading(false);}
  },[]);

  useEffect(()=>{loadData();},[loadData]);

  // ── SAVE CHEMICAL (CREATE or UPDATE) ──────────────────────────────────────
  const saveChemical=async(form)=>{
    setSaving(true);
    try{
      const docId=form.docId||null;
      const data={};
      for(const[k,v]of Object.entries(form)){
        if(k==="docId"||k==="_outMode"||k==="outAmount"||k==="outNote")continue;
        data[k]=v;
      }
      if(docId){
        // ── UPDATE existing document ──
        await fsUpdate("chemicals",docId,data);
        setChemicals(p=>p.map(c=>c.docId===docId?{...data,docId}:c));
      }else{
        // ── CREATE new document ──
        const res=await fsAdd("chemicals",data);
        const nd=fromDoc(res);
        if(nd)setChemicals(p=>[...p,nd]);
      }
    }catch(err){alert("❌ Save failed: "+err.message);}
    setSaving(false);
  };

  // ── ADD LOG & UPDATE AMOUNT ───────────────────────────────────────────────
  const addLog=async(entry)=>{
    try{
      const{docId,...logData}=entry;
      const res=await fsAdd("logs",logData);
      const nd=fromDoc(res);
      const newLogs=[...logs,nd||logData].sort((a,b)=>(a.date||"").localeCompare(b.date||""));
      setLogs(newLogs);
      // Update chemical amount to closing balance
      const chem=chemicals.find(c=>String(c.id)===String(entry.chemId));
      if(chem?.docId){
        const{closing}=buildLedger(chem,newLogs);
        await fsUpdate("chemicals",chem.docId,{amount:closing});
        setChemicals(p=>p.map(c=>c.docId===chem.docId?{...c,amount:closing}:c));

        // ── TELEGRAM AUTO ALERT ──
        if(closing<=Number(chem.lowStockThreshold||0)){
          const cfg=getTgConfig();
          if(cfg.token&&cfg.chatId){
            const result=await sendTelegramAlert([{
              name:chem.name,code:chem.code,
              closing:parseFloat(closing.toFixed(3)),unit:chem.unit,
              threshold:chem.lowStockThreshold,rack:chem.rack
            }]);
            setAlertSent(result.ok?"✅ Telegram অ্যালার্ট পাঠানো হয়েছে!":"⚠️ অ্যালার্ট পাঠাতে ব্যর্থ");
            setTimeout(()=>setAlertSent(null),4000);
          }
        }
      }
    }catch(e){console.error("Log error:",e);}
  };

  // ── DELETE LOG ────────────────────────────────────────────────────────────
  const deleteLog=async(log)=>{
    try{
      if(log.docId)await fsDelete("logs",log.docId);
      const newLogs=logs.filter(l=>(l.docId||l.id)!==(log.docId||log.id));
      setLogs(newLogs);
      const chem=chemicals.find(c=>String(c.id)===String(log.chemId));
      if(chem?.docId){
        const{closing}=buildLedger(chem,newLogs);
        await fsUpdate("chemicals",chem.docId,{amount:closing});
        setChemicals(p=>p.map(c=>c.docId===chem.docId?{...c,amount:closing}:c));
      }
    }catch(e){alert("Delete error: "+e.message);}
  };

        <div style={{fontSize:"11px",color:"#475569",marginTop:"4px",letterSpacing:"2px"}}>v3.0 · SMART CHEMICAL WMS</div>
        <div style={{width:"260px",height:"3px",background:"#1e293b",borderRadius:"2px",margin:"18px auto 10px",overflow:"hidden"}}>
          <div style={{height:"100%",background:"linear-gradient(90deg,#38bdf8,#7c3aed,#38bdf8)",backgroundSize:"200% 100%",animation:"shimmer 1.5s infinite",borderRadius:"2px"}}/>
        </div>

      <div style={{position:"absolute",bottom:"20px",textAlign:"center",zIndex:1,animation:"fadeIn 1s ease .5s both"}}>

      </div>

          </div>
          <div style={{background:isDark?"#0a1628":"#fff",border:`1px solid ${isDark?"#1e3a5f":"#cbd5e1"}`,borderRadius:"14px",padding:"20px",marginBottom:"16px"}}>
            <div style={{color:"#38bdf8",fontWeight:"800",fontSize:"16px",marginBottom:"16px"}}>🌐 {lang==="bn"?"ভাষা":"Language"}</div>
            <div style={{display:"flex",gap:"10px"}}>
              {[["bn","🇧🇩 বাংলা"],["en","🇬🇧 English"]].map(([v,l])=>(
                <button key={v} onClick={()=>setLang(v)}
                  style={{flex:1,padding:"12px",borderRadius:"10px",border:`2px solid ${lang===v?"#38bdf8":"#334155"}`,
                    background:lang===v?"#38bdf822":isDark?"#1e293b":"#f1f5f9",
                    color:lang===v?"#38bdf8":isDark?"#94a3b8":"#64748b",cursor:"pointer",
                    fontSize:"14px",fontWeight:"700",fontFamily:"'JetBrains Mono',monospace"}}>
                  {l}
                </button>
              ))}
            </div>
          </div>
          <div style={{background:isDark?"#0a1628":"#fff",border:`1px solid ${isDark?"#1e3a5f":"#cbd5e1"}`,borderRadius:"14px",padding:"20px"}}>
            <div style={{color:"#38bdf8",fontWeight:"800",fontSize:"16px",marginBottom:"16px"}}>🤖 {lang==="bn"?"টেলিগ্রাম অ্যালার্ট":"Telegram Alert"}</div>
            <button onClick={()=>setTgModal(true)}
              style={{width:"100%",padding:"13px",borderRadius:"10px",border:`1px solid ${getTgConfig().token?"#4ade8055":"#334155"}`,
                background:getTgConfig().token?"#14532d33":isDark?"#1e293b":"#f1f5f9",
                color:getTgConfig().token?"#4ade80":isDark?"#94a3b8":"#64748b",cursor:"pointer",
                fontSize:"14px",fontWeight:"700",fontFamily:"'JetBrains Mono',monospace"}}>
              {getTgConfig().token?(lang==="bn"?"✅ Alert চালু — সেটিং পরিবর্তন করুন":"✅ Alert ON — Change Settings"):(lang==="bn"?"⚙️ সেটআপ করুন":"⚙️ Setup")}
            </button>
          </div>
        </div>
      )}

      {/* FOOTER */}
      <div style={{background:isDark?"#020c1b":"#f0f4f8",borderTop:isDark?"1px solid #1e293b":"1px solid #cbd5e1",padding:"12px 20px",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:"6px",marginTop:"20px"}}>
        <div style={{fontSize:"10px",color:"#334155"}}>⚗️ ChemStore Pro v3.0 · GHS/UN · WAC · Firebase Firestore</div>
        <div style={{fontSize:"10px",color:"#475569",display:"flex",gap:"14px",flexWrap:"wrap"}}>
          <span>👨‍💻 Md Khairul Islam</span>
          <a href="https://wa.me/8801927999251" style={{color:"#25D366",textDecoration:"none"}}>📱 +8801927999251</a>
        </div>
      </div>

      {modal!==null&&(
        <ChemModal chem={modal} chemicals={chemicals} racks={racks} logs={logs}
          onSave={saveChemical} onLog={addLog}
          onClose={()=>setModal(null)} onAddRack={addRack}/>
      )}
      {tgModal&&<TelegramSettingsModal onClose={()=>setTgModal(false)}/>}
      {alertSent&&(
        <div style={{position:"fixed",bottom:"24px",right:"24px",zIndex:2000,
          background:alertSent.startsWith("✅")?"#14532d":"#7f1d1d",
          border:`1px solid ${alertSent.startsWith("✅")?"#4ade80":"#ef4444"}`,
          color:alertSent.startsWith("✅")?"#4ade80":"#f87171",
          borderRadius:"10px",padding:"12px 18px",fontSize:"14px",fontWeight:"700",
          boxShadow:"0 4px 20px #00000088",animation:"fadeIn .3s ease",fontFamily:"'JetBrains Mono',monospace"}}>
          {alertSent}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
